<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="밀로그(MEALOG) 앱 다운로드 - 구글 플레이 스토어">
    <meta name="theme-color" content="#3cb889">
    <title>밀로그 앱 다운로드 - Google Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="assets/icon_192.png" type="image/png" sizes="192x192">
    <link rel="shortcut icon" href="assets/icon_32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-emerald-600 mb-2">MEALOG</h1>
                <p class="text-slate-500 text-sm">구글 플레이 스토어로 이동합니다</p>
            </div>
            <div id="apkContent" class="space-y-4">
                <div class="text-center py-8 text-slate-500">
                    <p class="text-sm font-bold mb-3">구글 플레이 스토어에서 밀로그 앱을 다운로드하세요.</p>
                    <a href="https://play.google.com/store/apps/details?id=com.mealog.app&pcampaignid=web_share" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 w-full py-4 bg-emerald-600 text-white rounded-xl font-bold text-lg hover:bg-emerald-700 transition-colors shadow-lg">
                        <i class="fa-brands fa-google-play text-xl"></i>
                        Google Play 열기
                    </a>
                </div>
            </div>
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <a href="./" class="text-emerald-600 hover:text-emerald-700 text-sm font-bold">
                    <i class="fa-solid fa-arrow-left mr-2"></i>메인으로 돌아가기
                </a>
            </div>
        </div>
    </div>
    <script>
        // 플레이 스토어로 자동 이동 (팝업 차단 대비 버튼도 유지)
        setTimeout(() => {
            window.location.href = 'https://play.google.com/store/apps/details?id=com.mealog.app&pcampaignid=web_share';
        }, 150);
    </script>
</body>
</html>
