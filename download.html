<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="밀로그(MEALOG) 앱 다운로드 - 우리가 함께한, 맛있었던 이야기">
    <meta name="theme-color" content="#10b981">
    <title>밀로그 앱 다운로드 - MEALOG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%23059669'/><text x='50%25' y='50%25' font-size='120' text-anchor='middle' dominant-baseline='central' fill='white'>🍽️</text></svg>" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-emerald-600 mb-2">MEALOG</h1>
                <p class="text-slate-500 text-sm">밀로그 앱 다운로드</p>
            </div>
            <div id="apkContent" class="space-y-4">
                <div class="text-center py-8 text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                    <p class="text-sm">로딩 중...</p>
                </div>
            </div>
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <a href="./" class="text-emerald-600 hover:text-emerald-700 text-sm font-bold">
                    <i class="fa-solid fa-arrow-left mr-2"></i>메인으로 돌아가기
                </a>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyDMhxZHK7CgtiUACy9fOIiT7IDUW1uAWBc",
            authDomain: "mealog-r0.firebaseapp.com",
            projectId: "mealog-r0",
            storageBucket: "mealog-r0.firebasestorage.app",
            messagingSenderId: "535597498508",
            appId: "1:535597498508:web:28a883a1acd8a955b87ba9",
            measurementId: "G-9BV2LKSTCD"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const APP_ID = 'mealog-r0';
        const container = document.getElementById('apkContent');
        try {
            const apkDoc = doc(db, 'artifacts', APP_ID, 'content', 'apk');
            const apkSnap = await getDoc(apkDoc);
            if (apkSnap.exists()) {
                const d = apkSnap.data();
                const sizeMb = d.fileSize ? (d.fileSize / (1024 * 1024)).toFixed(2) : '';
                container.innerHTML = `
                    <div class="text-center space-y-4">
                        <p class="text-slate-600">밀로그 앱을 다운로드하세요</p>
                        ${d.version ? `<p class="text-slate-500 text-sm">버전 ${d.version}</p>` : ''}
                        ${sizeMb ? `<p class="text-slate-500 text-xs">${sizeMb} MB</p>` : ''}
                        <a href="${d.downloadUrl}" download="${d.fileName || 'mealog.apk'}" class="inline-flex items-center justify-center gap-2 w-full py-4 bg-emerald-600 text-white rounded-xl font-bold text-lg hover:bg-emerald-700 transition-colors shadow-lg">
                            <i class="fa-solid fa-download text-xl"></i>
                            다운로드
                        </a>
                        <p class="text-xs text-slate-400">Android 전용 APK 파일입니다</p>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-slate-500">등록된 APK가 없습니다.</p>
                        <p class="text-slate-400 text-sm mt-2">관리자가 APK를 등록하면 이곳에서 다운로드할 수 있습니다.</p>
                    </div>
                `;
            }
        } catch (e) {
            console.error('APK 로드 실패:', e);
            container.innerHTML = `
                <div class="text-center py-8">
                    <p class="text-red-500">다운로드 정보를 불러오는데 실패했습니다.</p>
                    <p class="text-slate-400 text-sm mt-2">잠시 후 다시 시도해주세요.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
