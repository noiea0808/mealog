name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from Secrets
        run: |
          echo "// API 설정 - GitHub Actions에서 자동 생성" > js/config.js
          echo "// GEMINI_API_KEY, GOOGLE_WEB_CLIENT_ID는 GitHub Secrets에서 가져옵니다." >> js/config.js
          echo "export const GEMINI_API_KEY = '${{ secrets.GEMINI_API_KEY }}';" >> js/config.js
          echo "export const GOOGLE_WEB_CLIENT_ID = '${{ secrets.GOOGLE_WEB_CLIENT_ID || '' }}';" >> js/config.js
          echo "생성된 config.js 파일 확인:" >> $GITHUB_STEP_SUMMARY
          cat js/config.js | sed 's/AIzaSy[^'"'"']*/AIzaSy***/' | sed 's/[0-9]*-[a-zA-Z0-9_-]*\.apps\.googleusercontent\.com/***.apps.googleusercontent.com/' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Verify config.js exists
        run: |
          if [ ! -f js/config.js ]; then
            echo "❌ js/config.js 파일이 생성되지 않았습니다!"
            exit 1
          fi
          if [ ! -s js/config.js ]; then
            echo "❌ js/config.js 파일이 비어있습니다!"
            exit 1
          fi
          echo "✅ js/config.js 파일 생성 확인됨"
          ls -la js/config.js
          echo ""
          echo "📄 config.js 내용 (API 키 마스킹):"
          cat js/config.js | sed 's/AIzaSy[^'"'"']*/AIzaSy***/'
        shell: bash

      - name: Verify required files
        run: |
          echo "📋 필수 파일 확인:"
          files=("index.html" "manifest.json" "sw.js" "js/config.js" "js/config.default.js")
          missing_files=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file 존재"
            else
              echo "❌ $file 없음!"
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "❌ 누락된 파일이 있습니다: ${missing_files[*]}"
            exit 1
          fi
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: List files before upload
        run: |
          echo "📁 배포할 파일 목록:"
          ls -la
          echo ""
          echo "📁 js 디렉토리:"
          ls -la js/ | grep -E "(config|\.js)"
          echo ""
          echo "📄 config.js 내용 확인 (API 키 마스킹):"
          if [ -f js/config.js ]; then
            cat js/config.js | sed 's/AIzaSy[^'"'"']*/AIzaSy***/'
            echo ""
            echo "✅ config.js 파일 크기:"
            wc -c js/config.js
          else
            echo "❌ js/config.js 파일이 없습니다!"
            exit 1
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # .gitignore에 있는 파일도 포함하도록 설정
          # config.js는 workflow에서 생성되므로 포함됨

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

