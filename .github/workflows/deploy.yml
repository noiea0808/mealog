name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from Secrets
        run: |
          # 시크릿 적용 여부 확인 (값 노출 없이 길이만 출력)
          WCID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          if [ -z "$WCID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID 시크릿이 비어 있습니다. Repository Secrets 또는 Environments → github-pages → Environment secrets에 추가하세요."
            echo "GOOGLE_WEB_CLIENT_ID: (비어 있음)" >> $GITHUB_STEP_SUMMARY
          else
            echo "GOOGLE_WEB_CLIENT_ID: 설정됨 (길이 ${#WCID})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "// API 설정 - GitHub Actions에서 자동 생성" > js/config.js
          echo "// Gemini는 Firebase Functions 환경 변수만 사용 (클라이언트 config에 포함하지 않음)" >> js/config.js
          echo "export const GOOGLE_WEB_CLIENT_ID = '${{ secrets.GOOGLE_WEB_CLIENT_ID }}';" >> js/config.js
          echo "export const DEMO_ACCOUNT_EMAIL = '${{ secrets.DEMO_ACCOUNT_EMAIL }}';" >> js/config.js
          echo "export const DEMO_ACCOUNT_PASSWORD = '${{ secrets.DEMO_ACCOUNT_PASSWORD }}';" >> js/config.js
          echo "export const KAKAO_JAVASCRIPT_KEY = '${{ secrets.KAKAO_JAVASCRIPT_KEY }}';" >> js/config.js
          echo "생성된 config.js 내용 (마스킹):" >> $GITHUB_STEP_SUMMARY
          cat js/config.js | sed 's/AIzaSy[^'"'"']*/AIzaSy***/' | sed 's/[0-9]*-[a-zA-Z0-9_-]*\.apps\.googleusercontent\.com/***.apps.googleusercontent.com/' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Verify config.js exists
        run: |
          if [ ! -f js/config.js ]; then
            echo "❌ js/config.js 파일이 생성되지 않았습니다!"
            exit 1
          fi
          if [ ! -s js/config.js ]; then
            echo "❌ js/config.js 파일이 비어있습니다!"
            exit 1
          fi
          echo "✅ js/config.js 파일 생성 확인됨"
          ls -la js/config.js
          echo ""
          echo "📄 config.js 내용 (API 키 마스킹):"
          cat js/config.js | sed 's/AIzaSy[^'"'"']*/AIzaSy***/'
          if grep -q "GOOGLE_WEB_CLIENT_ID = ''" js/config.js 2>/dev/null; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID가 비어 있습니다. Settings → Secrets and variables → Actions에서 GOOGLE_WEB_CLIENT_ID 시크릿을 추가하세요. (Environments 사용 시 github-pages 환경의 Environment secrets에도 추가)"
          fi
        shell: bash

      - name: Verify required files
        run: |
          echo "📋 필수 파일 확인:"
          files=("index.html" "manifest.json" "sw.js" "js/config.js" "js/config.default.js" "kakao-app-oauth-bridge.html")
          missing_files=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file 존재"
            else
              echo "❌ $file 없음!"
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "❌ 누락된 파일이 있습니다: ${missing_files[*]}"
            exit 1
          fi
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: List files before upload
        run: |
          echo "📁 배포할 파일 목록:"
          ls -la
          echo ""
          echo "📁 js 디렉토리:"
          ls -la js/ | grep -E "(config|\.js)"
          echo ""
          echo "📄 config.js 내용 확인 (API 키 마스킹):"
          if [ -f js/config.js ]; then
            cat js/config.js | sed 's/AIzaSy[^'"'"']*/AIzaSy***/'
            echo ""
            echo "✅ config.js 파일 크기:"
            wc -c js/config.js
          else
            echo "❌ js/config.js 파일이 없습니다!"
            exit 1
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # .gitignore에 있는 파일도 포함하도록 설정
          # config.js는 workflow에서 생성되므로 포함됨

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

