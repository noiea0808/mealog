<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>mealog · 기록 입력 시트 시안 v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --green: #059669;
      --green-deep: #047857;
      --green-soft: #ecfdf5;
      --green-mute: #a7f3d0;
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #94a3b8;
      --line: #e2e8f0;
      --page: #f8fafc;
      --star: #fbbf24;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
    }
    .topbar {
      width: min(390px, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .topbar a, .topbar button {
      font-size: 12.5px;
      font-weight: 600;
      color: #a7f3d0;
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }
    .topbar .title {
      width: 100%;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .phone {
      width: min(390px, 100%);
      height: min(844px, calc(100dvh - 120px));
      background: #334155;
      border-radius: 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #020617;
      border-radius: 20px;
      z-index: 5;
    }
    .dim {
      height: 72px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #1e293b, #334155);
      display: flex;
      align-items: flex-end;
      padding: 0 20px 10px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-weight: 600;
    }

    .sheet {
      flex: 1;
      min-height: 0;
      background: var(--page);
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.35);
    }
    .grabber {
      width: 40px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 999px;
      margin: 10px auto 6px;
      flex-shrink: 0;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 12px;
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .ctx-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--page);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .ctx-chip.slot {
      background: #ecfdf5;
      border-color: var(--green-mute);
      color: var(--green-deep);
    }
    .ctx-chip.slot-snack {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #c2410c;
    }
    .mode-seg {
      display: flex;
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      margin-left: auto;
    }
    .mode-seg button {
      border: 0;
      background: transparent;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }
    .mode-seg button.active {
      background: #fff;
      color: var(--green-deep);
      box-shadow: 0 1px 3px rgba(15,23,42,0.08);
    }
    .close-btn {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      display: grid;
      place-items: center;
      text-decoration: none;
      border-radius: 10px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-body::-webkit-scrollbar { width: 0; }

    .photo-hero {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #e2e8f0;
      aspect-ratio: 16 / 10;
      margin-bottom: 16px;
    }
    .photo-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-count {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15,23,42,0.5);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
    }
    .photo-tools {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      gap: 6px;
    }
    .photo-tools span {
      background: rgba(15,23,42,0.55);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .title-input {
      width: 100%;
      border: 0;
      background: transparent;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      outline: none;
      font-family: inherit;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .place-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .tag-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .pill {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }
    .pill.active {
      background: var(--green-soft);
      border-color: var(--green-mute);
      color: var(--green-deep);
    }
    .pill.more {
      border-style: dashed;
      color: var(--muted);
    }

    .mood, .memo {
      background: #fff;
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .mood-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .mood-head span { color: var(--muted); font-weight: 600; font-size: 11.5px; }
    .stars { display: flex; gap: 6px; margin-bottom: 10px; color: var(--star); font-size: 22px; }
    .stars .off { color: #e2e8f0; }
    .satiety { display: flex; gap: 6px; }
    .satiety span {
      flex: 1;
      text-align: center;
      border: 1px solid var(--line);
      background: var(--page);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .satiety span.on {
      background: var(--green-soft);
      border-color: var(--green-mute);
      color: var(--green-deep);
    }
    .memo p {
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--ink-2);
    }
    .advanced {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .advanced span {
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .sheet-actions {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      padding: 12px 14px calc(14px + var(--safe-bottom));
      background: #fff;
      border-top: 1px solid var(--line);
    }
    .act-ghost, .act-share {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--ink-2);
      font-size: 16px;
    }
    .act-ghost { color: #e11d48; border-color: #fecdd3; }
    .act-primary {
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);
    }

    .phone[data-mode="snack"] .ctx-chip.slot {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #c2410c;
    }
    .daily-block { display: none; }
    .meal-block { display: block; }
    .phone[data-mode="daily"] .meal-block { display: none; }
    .phone[data-mode="daily"] .daily-block { display: block; }
    .phone[data-mode="daily"] .mode-seg { visibility: hidden; }

    .vitals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .vital-card {
      background: #fff;
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 16px;
      padding: 12px;
    }
    .vital-card .l { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .vital-card .v { font-size: 22px; font-weight: 700; }
    .vital-card .v small { font-size: 12px; color: var(--muted); margin-left: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">기록 입력 시트 시안 v2</div>
      <a href="./index.html">허브</a>
      <a href="./home-feed-v2.html?phone=1">← 밀로그</a>
      <a href="./mealdang-v2.html?phone=1">밀당</a>
      <a href="./moment-feed-v2.html?phone=1">모먼트</a>
      <a href="./lounge-v2.html?phone=1">라운지</a>
      <button type="button" data-mode="meal">식사</button>
      <button type="button" data-mode="snack">간식</button>
      <button type="button" data-mode="daily">하루 기록</button>
    </div>

    <div class="phone" id="phone" data-mode="meal">
      <div class="notch"></div>
      <div class="dim">타임라인 위 · 바텀시트</div>

      <div class="sheet">
        <div class="grabber"></div>
        <header class="sheet-header">
          <span class="ctx-chip">7월 21일</span>
          <span class="ctx-chip slot" id="slotChip">점심</span>
          <div class="mode-seg">
            <button type="button" class="active" data-mode="meal">식사</button>
            <button type="button" data-mode="snack">간식</button>
          </div>
          <a class="close-btn" href="./home-feed-v2.html?phone=1" aria-label="닫기"><i class="fa-solid fa-xmark"></i></a>
        </header>

        <div class="sheet-body">
          <div class="photo-hero">
            <img id="photoImg" alt="" src="https://images.unsplash.com/photo-1482049016688-2d3e1b311543?w=900&q=80&auto=format&fit=crop" />
            <span class="photo-count">1 / 5</span>
            <div class="photo-tools">
              <span><i class="fa-solid fa-camera"></i> 카메라</span>
              <span><i class="fa-regular fa-image"></i> 앨범</span>
            </div>
          </div>

          <div class="meal-block">
            <div class="title-input" id="menuTitle">아보카도 토스트, 스크램블</div>
            <div class="place-row"><i class="fa-solid fa-location-dot"></i> <span id="placeText">한남동 브런치</span></div>

            <div class="tag-label" id="tagLabel">어떻게</div>
            <div class="pills" id="pills">
              <button class="pill" type="button">집밥</button>
              <button class="pill active" type="button">외식</button>
              <button class="pill" type="button">배달</button>
              <button class="pill" type="button">구내식당</button>
              <button class="pill more" type="button">더</button>
            </div>

            <div class="mood">
              <div class="mood-head">오늘의 느낌 <span>선택</span></div>
              <div class="stars">★ ★ ★ ★ <span class="off">★</span></div>
              <div class="satiety">
                <span>한입</span><span>가볍게</span><span class="on">적당히</span><span>배부름</span><span>과식</span>
              </div>
            </div>

            <div class="memo">
              <p id="memoText">날씨 좋아서 창가 자리. 커피는 아메리카노로.</p>
            </div>

            <div class="advanced">
              <span>+ 누구와</span><span>+ 시간</span><span>건너뛰기</span>
            </div>
          </div>

          <div class="daily-block">
            <div class="vitals">
              <div class="vital-card"><div class="l">체중</div><div class="v">62.4<small>kg</small></div></div>
              <div class="vital-card"><div class="l">공복 혈당</div><div class="v">98<small>mg/dL</small></div></div>
            </div>
            <div class="memo"><p>운동 다녀옴. 저녁은 가볍게.</p></div>
          </div>
        </div>

        <div class="sheet-actions">
          <div class="act-ghost"><i class="fa-regular fa-trash-can"></i></div>
          <div class="act-primary">기록 완료</div>
          <div class="act-share"><i class="fa-solid fa-share-nodes"></i></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const phone = document.getElementById("phone");
    const slotChip = document.getElementById("slotChip");
    const menuTitle = document.getElementById("menuTitle");
    const placeText = document.getElementById("placeText");
    const tagLabel = document.getElementById("tagLabel");
    const pills = document.getElementById("pills");
    const memoText = document.getElementById("memoText");
    const photoImg = document.getElementById("photoImg");

    const mealPills = `<button class="pill" type="button">집밥</button><button class="pill active" type="button">외식</button><button class="pill" type="button">배달</button><button class="pill" type="button">구내식당</button><button class="pill more" type="button">더</button>`;
    const snackPills = `<button class="pill active" type="button">커피</button><button class="pill" type="button">차/음료</button><button class="pill" type="button">디저트</button><button class="pill" type="button">과일</button><button class="pill more" type="button">더</button>`;

    function setMode(mode) {
      phone.dataset.mode = mode;
      document.querySelectorAll(".mode-seg button, .topbar button[data-mode]").forEach((b) => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
      if (mode === "snack") {
        slotChip.textContent = "오전 간식";
        menuTitle.textContent = "아이스 라떼";
        placeText.textContent = "사무실";
        tagLabel.textContent = "종류";
        pills.innerHTML = snackPills;
        memoText.textContent = "회의 전에 한 잔.";
        photoImg.src = "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=900&q=80&auto=format&fit=crop";
      } else if (mode === "daily") {
        slotChip.textContent = "하루 기록";
      } else {
        slotChip.textContent = "점심";
        menuTitle.textContent = "아보카도 토스트, 스크램블";
        placeText.textContent = "한남동 브런치";
        tagLabel.textContent = "어떻게";
        pills.innerHTML = mealPills;
        memoText.textContent = "날씨 좋아서 창가 자리. 커피는 아메리카노로.";
        photoImg.src = "https://images.unsplash.com/photo-1482049016688-2d3e1b311543?w=900&q=80&auto=format&fit=crop";
      }
    }

    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });
  </script>
</body>
</html>
